model:
  provider: custom
  model: Qwen3.6-35B-A3B-NVFP4
  base_url: http://vllm-writer:8000/v1
  api_key: "none"

# why: everything not listed is off (SPEC §5); web = fetch for reading
# sources, terminal = himalaya/curl/aws, file = drafting locally
toolsets:
  - terminal
  - web
  - file
