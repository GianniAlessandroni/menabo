# =============================================================================
#  menabò — an experiment in human-agent newsroom integration
# -----------------------------------------------------------------------------
#  File:     spark-a/agents/impaginatore/himalaya.toml
#  Purpose:  himalaya CLI account for the impaginatore: proactive SMTP plus
#            IMAP against the internal mail-server (SPEC §5). Secret-free —
#            the password is read from the container environment at run time.
#  Author:   Gianni Alessandroni
#  Created:  2026-08-17
#  License:  Apache-2.0 — see LICENSE
#  Part of:  menabò https://github.com/GianniAlessandroni/menabo
# =============================================================================

[accounts.default]
email = "impaginatore@redazione.local"
display-name = "impaginatore"
default = true

# why: IMAP 993 implicit TLS / SMTP 587 STARTTLS — the internal CA is baked
# into the agent image trust store by scripts/setup-tls.sh.
backend.type = "imap"
backend.host = "mail-server"
backend.port = 993
backend.encryption.type = "tls"
backend.login = "impaginatore@redazione.local"
backend.auth.type = "password"
# why: the Hermes terminal tool strips EMAIL_* from subprocess environments,
# so the password comes from a file that setup-env.sh projects out of
# spark-a/.env (mounted read-only next to this config; not in git).
backend.auth.cmd = "cat /opt/data/.config/himalaya/password"

message.send.backend.type = "smtp"
message.send.backend.host = "mail-server"
message.send.backend.port = 587
message.send.backend.encryption.type = "start-tls"
message.send.backend.login = "impaginatore@redazione.local"
message.send.backend.auth.type = "password"
message.send.backend.auth.cmd = "cat /opt/data/.config/himalaya/password"

# why: DMS special folders match himalaya's canonical names; declared anyway
# so a failed save-to-Sent can never be mistaken for a send failure.
folder.aliases.inbox = "INBOX"
folder.aliases.sent = "Sent"
folder.aliases.drafts = "Drafts"
folder.aliases.trash = "Trash"
