# =============================================================================
#  menabò — an experiment in human-agent newsroom integration
# -----------------------------------------------------------------------------
#  File:     spark-a/agents/impaginatore/config.yaml
#  Purpose:  Hermes runtime config for the impaginatore: writer endpoint,
#            terminal+file toolsets, WordPress via mcp-adapter (Contributor).
#  Author:   Gianni Alessandroni
#  Created:  2026-08-16
#  License:  Apache-2.0 — see LICENSE
#  Part of:  menabò https://github.com/GianniAlessandroni/menabo
# =============================================================================

model:
  provider: custom
  model: Qwen3.6-35B-A3B-NVFP4
  base_url: http://vllm-writer:8000/v1
  api_key: "none"
  # why: matches --max-model-len on the vLLM side, so Hermes plans
  # compaction against the real window instead of learning it from 400s
  context_length: 262144

# why: gateway turns resolve tools per platform (platform_toolsets.email is
# the allow-list; everything not listed is off, SPEC §5). web is limited by
# SOUL.md to fetching support images from the closed list of licensed
# sources. The wordpress MCP server below stays available: servers from
# mcp_servers are included unless an allow-list of server names is given.
platform_toolsets:
  email:
    - terminal
    - web
    - file
    - skills

# why: auxiliary tasks stay on the local writer — the image's auto-chain
# otherwise dials OpenRouter/Nous (external egress, paid lane) on hiccups.
auxiliary:
  compression:
    provider: custom
    base_url: http://vllm-writer:8000/v1
    model: Qwen3.6-35B-A3B-NVFP4
    api_key: "none"
  title_generation:
    provider: custom
    base_url: http://vllm-writer:8000/v1
    model: Qwen3.6-35B-A3B-NVFP4
    api_key: "none"

mcp_servers:
  wordpress:
    # why: WordPress/mcp-adapter streamable-HTTP endpoint, internal name;
    # auth = Application Password of the Contributor user (never wider)
    url: http://wordpress:80/wp-json/mcp/mcp-adapter-default-server
    headers:
      Authorization: "Basic ${WORDPRESS_MCP_BASIC_AUTH}"

# why: peer agents mail mid-turn constantly; queueing gives each mail its
# own orderly turn instead of derailing the run in progress (the busy acks
# themselves are disabled via compose: HERMES_GATEWAY_BUSY_ACK_ENABLED).
display:
  busy_input_mode: queue
  busy_text_mode: queue
