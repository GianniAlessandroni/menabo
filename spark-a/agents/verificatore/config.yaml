# =============================================================================
#  menabò — an experiment in human-agent newsroom integration
# -----------------------------------------------------------------------------
#  File:     spark-a/agents/verificatore/config.yaml
#  Purpose:  Hermes runtime config for the verificatore: multimodal verifier
#            endpoint on node B, terminal+web+file toolsets.
#  Author:   Gianni Alessandroni
#  Created:  2026-08-16
#  License:  Apache-2.0 — see LICENSE
#  Part of:  menabò https://github.com/GianniAlessandroni/menabo
# =============================================================================

model:
  provider: custom
  model: Qwen3.6-27B-NVFP4
  # why: verifier vLLM runs on node B; host set in .env (VERIFIER_BASE_URL)
  base_url: ${VERIFIER_BASE_URL}
  api_key: "none"
  # why: matches --max-model-len on the vLLM side, so Hermes plans
  # compaction against the real window instead of learning it from 400s
  context_length: 262144

# why: gateway turns resolve tools per platform (platform_toolsets.email is
# the allow-list; everything not listed is off, SPEC §5). web = fetch for
# source checking, terminal = himalaya/curl/aws, file = local notes,
# skills unlocks the bundled himalaya email skill.
platform_toolsets:
  email:
    - terminal
    - web
    - file
    - skills

# why: auxiliary tasks stay on the node-B verifier — the image's auto-chain
# otherwise dials OpenRouter/Nous (external egress, paid lane) on hiccups.
auxiliary:
  compression:
    provider: custom
    base_url: ${VERIFIER_BASE_URL}
    model: Qwen3.6-27B-NVFP4
    api_key: "none"
  title_generation:
    provider: custom
    base_url: ${VERIFIER_BASE_URL}
    model: Qwen3.6-27B-NVFP4
    api_key: "none"

# why: peer agents mail mid-turn constantly; queueing gives each mail its
# own orderly turn instead of derailing the run in progress (the busy acks
# themselves are disabled via compose: HERMES_GATEWAY_BUSY_ACK_ENABLED).
display:
  busy_input_mode: queue
  busy_text_mode: queue
