model:
  provider: custom
  model: Qwen3.6-35B-A3B-NVFP4
  base_url: http://vllm-writer:8000/v1
  api_key: "none"

# why: everything not listed is off (SPEC §5 "tutto il resto disattivato");
# terminal drives himalaya + aws, file edits the public status file,
# memory is explicitly granted to this agent only.
toolsets:
  - terminal
  - file
  - memory
