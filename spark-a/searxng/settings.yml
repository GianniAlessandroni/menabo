use_default_settings: true

server:
  # why: real value comes from the SEARXNG_SECRET environment variable
  secret_key: "overridden-by-environment"
  limiter: false
  public_instance: false

search:
  # why: the agents consume the JSON API (format=json), humans get html
  formats:
    - html
    - json

valkey:
  url: valkey://valkey:6379/0
